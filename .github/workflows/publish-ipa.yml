name: 发布未签名 IPA

on:
  push:
    branches: [ios-ci]
    paths:
      - '.github/workflows/publish-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 下载 CI 产物并挂到公开 release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载未签名 IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            gh run download 45946273362 --repo "${{ github.repository }}" -n jiangshui-unsigned-ipa -D out
          } > /tmp/dl.log 2>&1
          rc=$?
          {
            echo "## 下载 artifact（rc=$rc）"
            echo '```'
            cat /tmp/dl.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: 创建公开 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            IPA="$(find out -type f -name '*.ipa' | head -1)"
            echo "IPA=$IPA"
            test -n "$IPA"
            gh release delete ios-ci-077f124 --repo "${{ github.repository }}" --yes || true
            gh release create ios-ci-077f124 "$IPA" --repo "${{ github.repository }}" \
              --title "iOS 1.5.2 未签名 IPA（077f124）" \
              --notes "CI run 45946273362 / commit 077f124。未签名，仅供 Sideloadly 等工具重签后侧载。"
          } > /tmp/rel.log 2>&1
          rc=$?
          {
            echo "## 创建 release（rc=$rc）"
            echo '```'
            cat /tmp/rel.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
