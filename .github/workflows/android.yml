name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must match android/app/build.gradle)
        required: true
        default: '53'
      version_name:
        description: Android versionName without leading v (must match android/app/build.gradle)
        required: true
        default: '1.3.4-rc2'

permissions:
  contents: write

jobs:
  android:
    name: Build signed debug APK
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = $env:ANDROID_HOME
          $sdkSource = 'ANDROID_HOME'
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
            $sdkSource = 'ANDROID_SDK_ROOT'
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            throw 'Android SDK not found: set ANDROID_HOME or ANDROID_SDK_ROOT to the Android SDK root (for example C:\Android\android-sdk).'
          }
          if (-not (Test-Path -LiteralPath $sdkRoot)) {
            throw "Android SDK path from $sdkSource does not exist: $sdkRoot"
          }
          $required = @(
            (Join-Path $sdkRoot 'build-tools\35.0.0\aapt2.exe'),
            (Join-Path $sdkRoot 'platforms\android-35\android.jar')
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -eq 0) {
            Write-Host 'Required Android SDK packages already present; skipping sdkmanager.'
          } else {
            $sdkManager = Join-Path $sdkRoot 'cmdline-tools\latest\bin\sdkmanager.bat'
            if (-not (Test-Path -LiteralPath $sdkManager)) {
              $cmd = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
              if ($cmd) { $sdkManager = $cmd.Source } else { throw 'sdkmanager.bat not found.' }
            }
            $licenseInput = (1..50 | ForEach-Object { 'y' }) -join [Environment]::NewLine
            $licenseInput | & $sdkManager "--sdk_root=$sdkRoot" --licenses
            if ($LASTEXITCODE -ne 0) {
              throw "sdkmanager --licenses failed with exit code $LASTEXITCODE"
            }
            & $sdkManager "--sdk_root=$sdkRoot" --install 'platforms;android-35' 'build-tools;35.0.0'
            if ($LASTEXITCODE -ne 0) {
              $missingAfter = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
              if ($missingAfter.Count -gt 0) {
                throw "sdkmanager failed with exit code $LASTEXITCODE and required packages are missing: $($missingAfter -join ', ')"
              }
              Write-Warning 'sdkmanager failed, but preinstalled Android SDK 35 packages are present; continuing.'
            }
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required Android SDK path missing: $path" }
          }
          # build-android.ps1 从 -ToolchainRoot\android-sdk 取 SDK；把 CI 的 SDK 挂到该布局下。
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'toolchain'
          New-Item -ItemType Directory -Force -Path $toolchain | Out-Null
          $sdkLink = Join-Path $toolchain 'android-sdk'
          if (-not (Test-Path -LiteralPath $sdkLink)) {
            New-Item -ItemType Junction -Path $sdkLink -Target $sdkRoot | Out-Null
          } else {
            Write-Host "Using existing toolchain SDK link: $sdkLink"
          }

      - name: Restore debug keystore
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_DEBUG_KEYSTORE_B64)) {
            throw 'Repository secret ANDROID_DEBUG_KEYSTORE_B64 is not set.'
          }
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'toolchain'
          New-Item -ItemType Directory -Force -Path $toolchain | Out-Null
          $keyFile = Join-Path $toolchain 'tomorrow-debug.keystore'
          $b64 = ($env:ANDROID_DEBUG_KEYSTORE_B64 -replace '\s', '')
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($b64))
          if ((Get-Item -LiteralPath $keyFile).Length -lt 1000) {
            throw 'Restored keystore is unexpectedly small.'
          }

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gradlePath = Join-Path $env:GITHUB_WORKSPACE 'android\app\build.gradle'
          if (-not (Test-Path -LiteralPath $gradlePath)) { throw "build.gradle not found: $gradlePath" }
          $gradle = Get-Content -LiteralPath $gradlePath -Raw
          $codeMatch = [regex]::Match($gradle, '(?m)\bversionCode\s+(\d+)')
          $nameMatch = [regex]::Match($gradle, '(?m)\bversionName\s+[''"]?([^''"\s]+)[''"]?')
          if (-not $codeMatch.Success) { throw "Could not parse versionCode from $gradlePath" }
          if (-not $nameMatch.Success) { throw "Could not parse versionName from $gradlePath" }
          $code = $codeMatch.Groups[1].Value
          $name = $nameMatch.Groups[1].Value
          if ($code -notmatch '^\d+$') { throw "Invalid Android versionCode: $code" }
          if ([string]::IsNullOrWhiteSpace($name)) { throw "Empty Android versionName in $gradlePath" }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION_CODE) -and $env:INPUT_VERSION_CODE -ne $code) {
              throw "workflow_dispatch version_code=$($env:INPUT_VERSION_CODE) does not match build.gradle versionCode=$code"
            }
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION_NAME) -and $env:INPUT_VERSION_NAME -ne $name) {
              throw "workflow_dispatch version_name=$($env:INPUT_VERSION_NAME) does not match build.gradle versionName=$name"
            }
          } else {
            $expectedTag = "v$name"
            if ($env:REF_NAME -ne $expectedTag) {
              throw "Tag $($env:REF_NAME) does not match build.gradle versionName '$name'; expected $expectedTag."
            }
          }
          "version_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build signed APK
        shell: pwsh
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'android-output'
          $buildDir = Join-Path $env:RUNNER_TEMP 'android-build'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $buildArgs = @{
            OutputDirectory = $outDir
            BuildDirectory = $buildDir
            ToolchainRoot = (Join-Path $env:GITHUB_WORKSPACE 'toolchain')
            VersionCode = $env:VERSION_CODE
            VersionName = $env:VERSION_NAME
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\build-android.ps1') @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "build-android.ps1 failed with exit code $LASTEXITCODE" }
          $builtApks = @(Get-ChildItem -LiteralPath $outDir -Filter '*.apk' -File)
          if ($builtApks.Count -ne 1) { throw "Expected exactly one APK in $outDir, found $($builtApks.Count)" }
          $apkName = "JiangShui-Schedule-$($env:VERSION_NAME).apk"
          $apk = Join-Path $outDir $apkName
          Move-Item -LiteralPath $builtApks[0].FullName -Destination $apk -Force
          $apksigner = Join-Path $env:GITHUB_WORKSPACE 'toolchain\android-sdk\build-tools\35.0.0\apksigner.bat'
          if (-not (Test-Path -LiteralPath $apksigner)) { throw "apksigner not found: $apksigner" }
          $verifyOutput = & $apksigner verify --print-certs --verbose $apk 2>&1
          if ($LASTEXITCODE -ne 0) { throw "apksigner verify failed with exit code $LASTEXITCODE" }
          $verifyText = ($verifyOutput | Out-String)
          $certMatch = [regex]::Match($verifyText, 'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $certMatch.Success) { throw 'Could not read certificate SHA-256 digest from apksigner output.' }
          $actualCert = ($certMatch.Groups[1].Value -replace ':', '').ToUpperInvariant()
          $expectedCert = '005B1BF12F8ACE80673546A284DBB0592CDE5804C8A19957AC05B9899A46CB0C'
          if ($actualCert -ne $expectedCert) {
            throw "APK certificate SHA-256 mismatch: expected $expectedCert, got $actualCert"
          }
          Write-Host "Verified APK certificate SHA-256: $actualCert"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $apk).Hash.ToLowerInvariant()
          "$hash  $apkName" | Set-Content -LiteralPath "$apk.sha256" -Encoding ascii
          Get-ChildItem -LiteralPath $outDir | Format-Table Name,Length

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiangShui-Schedule-${{ steps.version.outputs.version_name }}
          path: |
            ${{ runner.temp }}/android-output/*.apk
            ${{ runner.temp }}/android-output/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ runner.temp }}/android-output/JiangShui-Schedule-${{ steps.version.outputs.version_name }}.apk
            ${{ runner.temp }}/android-output/JiangShui-Schedule-${{ steps.version.outputs.version_name }}.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
